<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    The same glyph AppIconGlyph paints in the app, at the same
    proportions: a rounded screen filled with the rose gradient, with the
    lower-left triangle cut clean out rather than darkened, so whatever
    sits behind it shows through.
  -->
  <defs>
    <linearGradient id="screen" x1="46" y1="108" x2="466" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <!--
      Two things here are deliberate, and both are about edges landing on
      the same pixel twice.

      The white is the whole canvas rather than a copy of the screen
      shape. A copy would anti-alias against the same outline the screen
      itself draws, and the two partial coverages multiply into a
      visibly thinner, darker rim.

      The cut-out overshoots the screen on the left, bottom and right
      rather than stopping exactly on its edge. Sharing an edge with the
      shape left roughly half a pixel of gradient surviving along the
      bottom, which read as a hairline across what should be nothing at
      all. The hypotenuse keeps its original slope of 0.5, so the cut
      still falls exactly where the app draws it.
    -->
    <mask id="veil">
      <rect width="512" height="512" fill="white"/>
      <path d="M40 192 L472 408 L472 412 L40 412 Z" fill="black"/>
    </mask>
  </defs>
  <rect x="46" y="108" width="420" height="297" rx="36" fill="url(#screen)" mask="url(#veil)"/>
</svg>
