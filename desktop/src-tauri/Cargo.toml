[package]
name = "aphanes-desktop"
description = "webOS Dev Mode Manager for desktop: the Tauri shell around aphanes-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aphanes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aphanes-protocol = { path = "../crates/aphanes-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Private keys go in the OS keychain (Credential Manager, Keychain, Secret
# Service), never in a file. Device metadata, which holds no secret, is a
# JSON file in the app data dir.
keyring = "4"
uuid = { version = "1", features = ["v4"] }
# The native file picker for "Install .ipk". Tauri's own first-party
# plugin; the frontend only ever asks it to open, never to save.
tauri-plugin-dialog = "2"
# In-app updates, checked only when asked from Settings. Every download is
# verified against the public key in tauri.conf.json before it installs.
tauri-plugin-updater = "2"

[lints]
workspace = true
