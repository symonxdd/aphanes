[package]
name = "aphanes-protocol"
description = "webOS TV protocol layer for the desktop app: pairing, SSH, luna calls, IPK install"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "aphanes_protocol"

[dependencies]
# SSH client to the TV's own sshd on port 9922. The legacy algorithms that
# sshd needs (ssh-rsa with SHA-1 signatures, diffie-hellman-group1-sha1,
# hmac-sha1) are in russh's base build; nothing extra is enabled for them.
#
# Crypto backend: `ring` rather than russh's default `aws-lc-rs`, because
# aws-lc-rs needs NASM (and CMake) on Windows to build, the same kind of
# extra toolchain that ruled out libssh. ring ships prebuilt assembly and
# builds with cargo alone on every desktop target.
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# HTTPS to developer.lge.com for the Developer Mode session's remaining
# time, the one request this crate makes to anything but the TV. TLS is
# rustls on `ring`, the same backend russh uses and for the same reason:
# reqwest's default provider (aws-lc-rs) needs NASM and CMake to build on
# Windows. `rustls-no-provider` leaves the provider choice to this crate,
# which registers ring once at first use (see devmode.rs). Certificates
# are verified against the OS trust store through rustls-platform-verifier,
# which that feature brings in.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# The devmode key server hands out a traditional OpenSSL-encrypted PEM
# (Proc-Type / DEK-Info headers). These RustCrypto crates, at the versions
# russh already depends on, decrypt it: EVP_BytesToKey is iterated MD5,
# the body is CBC with PKCS#7 padding under AES or triple DES.
aes = "0.9"
cbc = "0.2"
des = "0.9"
md5 = "0.8"
data-encoding = "2"
russh-sftp = "3"
sha2 = "0.11"

[lints]
workspace = true
