name: Release

# Only ever runs from a v* tag, which `dart run tool/release.dart` pushes
# as its last step.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Decoded outside the checkout so it cannot end up in the APK or in
      # an artifact. The size check is the one guard worth keeping: a
      # wrong password or a bad alias makes Gradle fail loudly, but a
      # keystore that never arrived makes it fall back to the debug key
      # and publish something that can never update an existing install.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          if [ ! -s "$RUNNER_TEMP/release.p12" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      # arm64 only. A universal APK carries native code for all three CPU
      # architectures and a phone uses exactly one, which is the
      # difference between about 57 MB and 20 MB.
      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "aphanes-v$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "aphanes-v$VERSION.apk" \
            --title "v$VERSION" \
            --generate-notes
