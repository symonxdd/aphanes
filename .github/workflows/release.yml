name: Release

# Only ever runs from a v* tag, which `dart run tool/release.dart` pushes
# as its last step.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The whole history, tags included. The release notes name the
          # previous tag, and the default shallow fetch has none.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Decoded outside the checkout so it cannot end up in the APK or in
      # an artifact. The size check only improves the error: an empty
      # keystore makes Gradle fail on its own, but with a stack trace
      # rather than a sentence naming the secret that never arrived.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          if [ ! -s "$RUNNER_TEMP/release.p12" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      # arm64 only. A universal APK carries native code for all three CPU
      # architectures and a phone uses exactly one, which is the
      # difference between about 57 MB and 20 MB.
      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      # The notes are this version's own CHANGELOG.md section, under a
      # header line, above a compare link. The link is left out of a first
      # release, which has no earlier tag to compare against.
      - name: Compose the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v want="## $GITHUB_REF_NAME" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md | sed 's/^### /## /')

          if [ -z "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME."
            exit 1
          fi

          {
            echo "📦 New Android version released: $GITHUB_REF_NAME"
            echo "$SECTION"
            PREVIOUS=$(git tag --list 'v*' --sort=-version:refname \
              | grep -vx "$GITHUB_REF_NAME" | head -n 1)
            if [ -n "$PREVIOUS" ]; then
              printf -- '---\n\n'
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$GITHUB_REF_NAME"
            fi
          } > "$RUNNER_TEMP/notes.md"

          echo "APK_NAME=aphanes-v$VERSION.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Aphanes v$VERSION" >> "$GITHUB_ENV"

      # Creates the release, or updates it if the tag already has one. A
      # tag can be pushed more than once, and a run that could only ever
      # create would fail every time after the first.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_NAME" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
